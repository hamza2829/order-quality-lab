name: End to end
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Start both services in Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Run REST Assured against the services
        run: mvn -B -ntp -Pe2e -pl e2e-tests test
      - name: Count end to end tests
        if: always()
        run: python3 scripts/test_evidence.py e2e
      - name: Capture service logs
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/compose.log
          docker compose down -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: end-to-end
          path: |
            e2e-tests/target/surefire-reports/
            reports/
