name: Integration and contracts
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp verify
      - name: Count integration and contract tests
        if: always()
        run: python3 scripts/test_evidence.py integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-and-contracts
          path: |
            **/target/failsafe-reports/
            **/target/site/jacoco/
            reports/integration.json
