name: Performance
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Record runner details
        run: |
          mkdir -p reports/perf
          { uname -a; lscpu; free -m; docker version; java -version; } > reports/perf/runner.txt 2>&1
      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Measure baseline, validate k6 and run JMeter
        run: bash scripts/perf.sh
      - name: Capture logs and stop services
        if: always()
        run: |
          docker compose logs --no-color > reports/perf/compose.log
          docker compose down -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-reports
          path: reports/perf/
